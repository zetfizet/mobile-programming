# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the Gradle Daemon.
# Increased memory to prevent OutOfMemoryError during dex merging.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Use AndroidX for all dependencies
android.useAndroidX=true

# Disable Jetifier to speed up builds (modern projects don't need it)
android.enableJetifier=false

# Enable parallel execution and configuration caching for better performance
org.gradle.parallel=true
org.gradle.caching=true
